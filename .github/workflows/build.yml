name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: --win
          # FFF and ffi-rs install native optional dependencies per architecture.
          - os: macos-14
            targets: --mac --arm64
          - os: macos-15-intel
            targets: --mac --x64
    runs-on: ${{ matrix.os }}
    # Publishing a GitHub Release on tag builds needs contents write access
    # for the workflow's built-in token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm ci does not run electron's postinstall on the runners, so the
      # dist binary the tests spawn is missing; install.js is idempotent.
      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      # npm test expects the test/workspace git fixture (baseline commit plus
      # pending changes), which is not part of the repository.
      - name: Install test fixtures
        run: npm run fixtures

      - name: Test
        run: npm test

      - name: Test bundled FFF native search
        run: npm run test:fff

      - name: Test bundled web extension
        run: npm run test:web

      - name: Build
        run: npm run build

      - name: Package
        # Publishing from both matrix jobs in parallel would race and create
        # two draft releases; the release job below publishes everything once.
        run: npx electron-builder ${{ matrix.targets }} --publish never
        env:
          # No signing identity exists on runners; keep unsigned builds explicit.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: PiX-${{ matrix.os }}-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    name: publish release
    needs: package
    # Only tag builds publish; branch builds stop at workflow artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PiX ${{ github.ref_name }}" \
            --generate-notes \
            release/*
