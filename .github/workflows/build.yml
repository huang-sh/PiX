name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: --win
          # Apple Silicon runner; x64 targets cross-build from it.
          - os: macos-14
            targets: --mac --arm64 --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm ci does not run electron's postinstall on the runners, so the
      # dist binary the tests spawn is missing; install.js is idempotent.
      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      # npm test expects the test-workspace git fixture (baseline commit plus
      # pending changes), which is not part of the repository.
      - name: Install test fixtures
        run: npm run fixtures

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package
        # onTag: branch builds only produce workflow artifacts; pushing a v*
        # tag publishes the installers to a GitHub Release via GH_TOKEN.
        run: npx electron-builder ${{ matrix.targets }} --publish onTag
        env:
          # Fine-grained PAT (Contents: read/write on this repo) stored as the
          # PIX_TOKEN Actions secret; required for tag-triggered releases only.
          GH_TOKEN: ${{ secrets.PIX_TOKEN }}
          # No signing identity exists on runners; keep unsigned builds explicit.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: PiX-${{ runner.os }}-0.0.1
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
