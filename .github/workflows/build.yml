name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  # External PRs run the same validation as main (typecheck, fixtures, tests);
  # the packaging steps below stay main/tag-only.
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: --win
          # FFF and ffi-rs install native optional dependencies per architecture.
          - os: macos-14
            targets: --mac --arm64
          - os: macos-15-intel
            targets: --mac --x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The two macOS runners share an OS cache partition; arch keeps their
      # native optional dependencies and electron archives separate.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      # The electron postinstall and electron-builder fetch platform archives
      # into their own caches, which the npm cache does not cover.
      - name: Cache electron archives
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~\AppData\Local\electron\Cache
            ~/.cache/electron-builder
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # npm test expects the test/workspace git fixture (baseline commit plus
      # pending changes), which is not part of the repository.
      - name: Install test fixtures
        run: npm run fixtures

      - name: Test
        run: npm test

      - name: Test bundled FFF native search
        run: npm run test:fff

      - name: Test installable web extension
        run: npm run test:web

      - name: Build
        if: github.event_name != 'pull_request'
        run: npm run build

      - name: Package
        if: github.event_name != 'pull_request'
        # The release job creates one draft with installers from all platforms.
        run: npx electron-builder ${{ matrix.targets }} --publish never
        env:
          # No signing identity exists on runners; keep unsigned builds explicit.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installers
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: PiX-${{ matrix.os }}-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  gui:
    name: gui smoke (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Electron needs the GTK/NSS/GBM runtime libraries and an X server, which
      # the runner image does not provide; the gui test wraps itself in xvfb-run.
      - name: Install Electron runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libgbm1 libatk-bridge2.0-0 libatk1.0-0 libcups2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2
          sudo apt-get install -y --no-install-recommends libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2

      - name: Install dependencies
        run: npm ci

      - name: Install test fixtures
        run: npm run fixtures

      - name: Build
        run: npm run build

      # Runs the gui smoke test plus a hot update of every i18n domain file, so
      # the renderer and its hot-reload wiring stay covered on every push.
      - name: GUI smoke test with i18n hot reload
        run: node test/gui-test.mjs --hmr

  release:
    name: draft release
    needs: package
    # Only tag builds create drafts; branch builds stop at workflow artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PiX ${{ github.ref_name }}" \
            --draft \
            --generate-notes \
            release/*
