appId: works.earendil.pix
productName: PiX
directories:
  output: release
  buildResources: build

# out/ (main, preload, renderer) and resources/ (window icon) go into the
# asar; pruned production node_modules are added automatically.
files:
  - out/**
  - resources/**

# Cross-platform binary pruning (esbuild ships ~230MB of other-platform
# binaries via pi's chord dependency). The hook also copies pi-web-access
# and its installed runtime dependency tree outside asar.
afterPack: scripts/strip-cross-platform-binaries.mjs

# node-pty ships NAPI prebuilds for every platform (node_modules/node-pty/
# prebuilds), so skip the electron rebuild entirely.
npmRebuild: false

# The SSH/WSL host installer looks for the server build at
# <resources>/server (see src/main/ssh-host-installer.ts candidate paths).
# The remote side npm-installs its own dependencies, so node_modules is
# excluded here.
extraResources:
  - from: server
    to: server
    filter:
      - "**/*"
      - "!node_modules/**"
  # Built-in skills (src/main/builtin-skills.ts resolves <resources>/skills).
  # Plain markdown outside the asar; the SSH/WSL installer uploads the same
  # tree to remote hosts as a sibling of the server bundle.
  - from: skills
    to: skills

win:
  icon: build/icon.png
  # The pi-computer-use helper prebuilts for other OSes are dead weight;
  # scripts/ stays because the extension runs its setup script at runtime.
  extraResources:
    # Bundled pi package (computer-use), resolved at runtime by
    # src/main/builtin-packages.ts from <resources>/pi-builtin. Shipped as
    # real files outside the asar because pi's extension loader expects
    # on-disk paths, same as user extensions in ~/.pi. The node_modules-style
    # layout keeps room for additional bundled packages.
    - from: node_modules/@injaneity/pi-computer-use
      to: pi-builtin/node_modules/@injaneity/pi-computer-use
      filter:
        - "**/*"
        - "!prebuilt/linux/**"
        - "!prebuilt/macos/**"
    # Keep the extension, Node SDK, and target-native libraries together so
    # imports resolve outside app.asar without a user install or download.
    - from: node_modules/@ff-labs/pi-fff
      to: pi-builtin/node_modules/@ff-labs/pi-fff
    - from: node_modules/@ff-labs/fff-node
      to: pi-builtin/node_modules/@ff-labs/fff-node
    - from: node_modules/@ff-labs/fff-bin-win32-${arch}
      to: pi-builtin/node_modules/@ff-labs/fff-bin-win32-${arch}
    - from: node_modules/ffi-rs
      to: pi-builtin/node_modules/ffi-rs
    - from: node_modules/@yuuang/ffi-rs-win32-${arch}-msvc
      to: pi-builtin/node_modules/@yuuang/ffi-rs-win32-${arch}-msvc
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

# Unsigned CI builds: identity null keeps electron-builder from discovering a
# signing identity (none exists on GitHub runners) and failing the build.
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  identity: null
  artifactName: PiX-${version}-${arch}.${ext}
  extraResources:
    - from: node_modules/@injaneity/pi-computer-use
      to: pi-builtin/node_modules/@injaneity/pi-computer-use
      filter:
        - "**/*"
        - "!prebuilt/linux/**"
        - "!prebuilt/windows/**"
    - from: node_modules/@ff-labs/pi-fff
      to: pi-builtin/node_modules/@ff-labs/pi-fff
    - from: node_modules/@ff-labs/fff-node
      to: pi-builtin/node_modules/@ff-labs/fff-node
    - from: node_modules/@ff-labs/fff-bin-darwin-${arch}
      to: pi-builtin/node_modules/@ff-labs/fff-bin-darwin-${arch}
    - from: node_modules/ffi-rs
      to: pi-builtin/node_modules/ffi-rs
    - from: node_modules/@yuuang/ffi-rs-darwin-${arch}
      to: pi-builtin/node_modules/@yuuang/ffi-rs-darwin-${arch}
  # npm installs native optional dependencies for the build machine. Build
  # each architecture on its matching runner (see .github/workflows/build.yml).
  target:
    - target: dmg
    - target: zip

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: PiX-Setup-${version}-${arch}.exe
  include: build/installer.nsh
  displayLanguageSelector: true
  installerLanguages:
    - en_US
    - zh_CN

portable:
  artifactName: PiX-Portable-${version}-${arch}.exe
